<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Saturday sample crop</title>
  <link rel="stylesheet" href="paper.css">
  <style>
    body { width: 420px; padding: 16px 16px 18px; }
    .date {
      margin: 0;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .rule { height: 1px; background: var(--ink); margin: 8px 0 10px; }
    .block { margin: 0 0 11px; }
    .block:last-child { margin-bottom: 0; }
    .k {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      margin-bottom: 1px;
    }
    .time {
      font-size: 2.15rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }
    p { margin: 0; font-size: 1.08rem; line-height: 1.25; }
    .hit { font-weight: 600; }
    .money { font-size: 1.65rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
  </style>
</head>
<body>
  <p class="sample">Sample</p>
  <p class="date">Saturday, June 12</p>
  <div class="rule"></div>
  <div class="block">
    <p class="time">4:00 pm</p>
    <p>Ceremony, Harbor House. Lead: Maya. If it moves inside, <span class="hit">Sam decides</span>.</p>
  </div>
  <div class="block">
    <span class="k">Still owed</span>
    <p>Venue <span class="money">$1,400</span>, due Friday.</p>
    <p>Dana Chen, 555-0142.</p>
  </div>
  <div class="block">
    <span class="k">In charge</span>
    <p>Sam, for decisions. Maya keeps the clock. Do not text the couple.</p>
  </div>
</body>
</html>
