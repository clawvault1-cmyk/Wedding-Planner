<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Who's in charge sample</title>
  <link rel="stylesheet" href="paper.css">
  <style>
    body { width: 400px; padding: 20px 18px 24px; }
    h1 { margin: 0 0 12px; font-size: 1.7rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; }
    .job { margin: 0; padding: 9px 0 8px; border-top: 1px solid var(--rule); }
    .k { display: block; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; }
    .name { display: block; margin-top: 1px; font-size: 1.65rem; font-weight: 600; letter-spacing: -0.03em; line-height: 1.05; }
    .rest { display: block; margin-top: 2px; font-size: 1.05rem; line-height: 1.25; }
    .close { margin: 12px 0 0; font-size: 1.2rem; font-weight: 600; line-height: 1.25; letter-spacing: -0.02em; }
  </style>
</head>
<body>
  <p class="sample">Sample</p>
  <h1>Saturday, June 12</h1>
  <p class="job"><span class="k">Decisions</span><span class="name">Sam Okonkwo</span><span class="rest">555-0190</span></p>
  <p class="job"><span class="k">The clock</span><span class="name">Maya Ruiz</span><span class="rest">555-0148</span></p>
  <p class="job"><span class="k">Rain call</span><span class="name">Sam</span><span class="rest">By 1:00 pm Friday.</span></p>
  <p class="job"><span class="k">Money</span><span class="name">Sam pays.</span><span class="rest">Maya does not.</span></p>
  <p class="job"><span class="k">A guest problem</span><span class="name">Maya</span></p>
  <p class="job"><span class="k">A vendor who is late</span><span class="name">Maya calls.</span><span class="rest">Sam decides whether to wait.</span></p>
  <p class="close">Do not text the couple unless Sam says to.</p>
</body>
</html>
